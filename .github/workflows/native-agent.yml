name: Native router agent
on:
  push:
    branches: [main, feature/native-router-agent, release/v1.7.10, fix/prepared-upgrade-reverse-slot-1-7-21]
  pull_request:
    paths: ['native-agent/**', '.github/workflows/native-agent.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native-agent/go.sum
      - name: Test native protocol and controller
        working-directory: native-agent
        run: |
          gofmt -w *.go
          go test -race -count=1 -v ./...
          go vet ./...
          sh test-install.sh
      - name: Build static ARM64 candidate
        working-directory: native-agent
        run: |
          sh build-package.sh
          cat dist/home-net-native-agent-1.7.21-linux-arm64.tar.gz.sha256
          cat dist/native-agent-arm64/BUILD-INFO
          sha256sum ../control-agent/install-native.sh
          mkdir -p dist/formatted-source
          cp *.go dist/formatted-source/
      - uses: actions/upload-artifact@v4
        with:
          name: native-agent-candidate
          path: native-agent/dist/
          retention-days: 7

  publish-canary-1-7-21:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/fix/prepared-upgrade-reverse-slot-1-7-21') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/prepared-upgrade-reverse-slot-1-7-21' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: test-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Publish exact pinned pre-release asset, never stable
        run: |
          set -euo pipefail
          mkdir artifact
          gh run download 43710101807 -R "$REPO" -n native-agent-candidate -D artifact
          test -f artifact/home-net-native-agent-1.7.21-linux-arm64.tar.gz
          echo '9131f96fb1df90622fe4d21b007294652c4406ecf46f51774d6302a54663109d  artifact/home-net-native-agent-1.7.21-linux-arm64.tar.gz' | sha256sum -c -
          grep -Fxq 'version=1.7.21' artifact/native-agent-arm64/BUILD-INFO
          grep -Fxq 'source_commit=46e58b826d04052d98a66aa064de0fb0fd7e18c3' artifact/native-agent-arm64/BUILD-INFO
          echo '9131f96fb1df90622fe4d21b007294652c4406ecf46f51774d6302a54663109d  home-net-native-agent-1.7.21-linux-arm64.tar.gz' >artifact/SHA256SUMS-CANARY
          TAG=v1.7.21-native-canary
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo 'Canary already published, refusing to overwrite'
            exit 1
          fi
          gh release create "$TAG" \
            artifact/home-net-native-agent-1.7.21-linux-arm64.tar.gz \
            artifact/SHA256SUMS-CANARY \
            -R "$REPO" \
            --target 46e58b826d04052d98a66aa064de0fb0fd7e18c3 \
            --title 'HOME NET native 1.7.21 — backup-only canary' \
            --notes 'Test-only prerelease. No stable bundle, no fleet rollout. SHA256 9131f96fb1df90622fe4d21b007294652c4406ecf46f51774d6302a54663109d.' \
            --prerelease
