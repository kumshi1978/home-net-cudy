name: Native router agent
on:
  push:
    branches: [feature/native-router-agent, release/v1.7.10]
  pull_request:
    paths: ['native-agent/**', '.github/workflows/native-agent.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native-agent/go.sum
      - name: Test native protocol and controller
        working-directory: native-agent
        run: |
          gofmt -w *.go
          go test -race -count=1 -v ./...
          go vet ./...
          sh test-install.sh
      - name: Build static ARM64 candidate
        working-directory: native-agent
        run: |
          sh build-package.sh
          cat dist/home-net-native-agent-1.7.17-linux-arm64.tar.gz.sha256
          cat dist/native-agent-arm64/BUILD-INFO
          sha256sum ../control-agent/install-native.sh
          mkdir -p dist/formatted-source
          cp *.go dist/formatted-source/
      - uses: actions/upload-artifact@v4
        with:
          name: native-agent-candidate
          path: native-agent/dist/
          retention-days: 7
