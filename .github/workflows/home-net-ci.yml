name: HOME NET CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/luci-home-net-dashboard, main]

permissions:
  contents: read

jobs:
  offline-tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - home-net-update-self-test
          - home-net-update
          - install-all-safety
          - home-net-luci
          - home-net-install-verify
          - luci-detached-upgrade
          - podkop-background
          - home-net-management
          - home-net-podkop-update
          - candidate-packaging
          - release-packaging
          - component-update-policy
          - home-net-vpn-manifest-validate
          - home-net-vpn-import
          - vpn-router
          - vpn-identity
          - vpn-cudy-adapter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Shell syntax
        run: |
          sh -n scripts/home-net-update
          sh -n install-all.sh
          sh -n install/install.sh
          sh -n "tests/test-${{ matrix.suite }}.sh"
      - name: Fetch pinned failover coordination fixture
        if: matrix.suite == 'vpn-router'
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/kumshi1978/openwrt-podkop-awg-failover/3ad80e17757cdb11705e8e201a6dbc422ed9ac23/install.sh \
            -o "$RUNNER_TEMP/failover-install.sh"
          printf 'HOME_NET_TEST_FAILOVER_INSTALLER=%s/failover-install.sh\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Offline regression tests
        run: sh "tests/test-${{ matrix.suite }}.sh"
      - name: Whitespace validation
        run: git diff-tree --check HEAD^ HEAD
