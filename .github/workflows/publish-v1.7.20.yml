name: Publish HOME NET 1.7.20
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.7.20.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: home-net-release-v1.7.20
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'kumshi1978/home-net-cudy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate manifest, provenance and manual rollout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '1.7.20'
          test "$(cat native-agent/VERSION)" = '1.7.18'
          grep -Fxq "HOME_NET_BUNDLE_VERSION='1.7.20'" bundle.conf
          grep -Fxq "CONTROL_AGENT_REF='c4e273d419bf4990786ee0dd09cd5744f6838948'" bundle.conf
          grep -Fxq "CONTROL_AGENT_INSTALL_SHA256='3c0513067718a1e6b580f2f4cc2c0a2d4fae86804472c41cdd7ef70fb1163f47'" bundle.conf
          echo '3c0513067718a1e6b580f2f4cc2c0a2d4fae86804472c41cdd7ef70fb1163f47  control-agent/install-native.sh' | sha256sum -c -
          grep -Fxq "DEFAULT_AUTO_UPDATE_MODE='check'" bundle.conf
          grep -Fxq "UPDATE_ACTION_CLASS='CONTROLLED'" bundle.conf
          grep -Fxq "ROLLOUT='manual'" rollout-policy.conf
          grep -Fxq "RELEASE_TAG='v1.7.13'" rollout-policy.conf
          grep -Fq '[ "$HOME_NET_BUNDLE_VERSION" = 1.7.20 ]' install-all.sh
          grep -Fq "HOME_NET_BUNDLE_REF:-v1.7.20" install-all.sh
          grep -Fq "HOME_NET_RELEASE_REF:-v1.7.20" install.sh
          sh tests/test-vpn-cudy-adapter.sh
          sh tests/test-vpn-router.sh
          sh tests/test-candidate-packaging.sh
          sh tests/test-release-packaging.sh
          sh tests/test-native-agent-bootstrap.sh
          sh tests/test-prepared-recovery-bundle.sh
          echo 'PASS v1.7.20 guarded native-only prepared recovery smoke'
          if gh release view v1.7.20 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite' >&2
            exit 1
          fi
      - name: Reuse pinned verified native ARM64 archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view v1.7.18-native --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft,.isPrerelease')" = "$(printf 'false\ntrue')"
          mkdir -p assets
          gh release download v1.7.18-native --repo "$GITHUB_REPOSITORY" --pattern 'home-net-native-agent-1.7.18-linux-arm64.tar.gz' --dir assets
          echo '3c08ef151b0ad7113f157e329bde2607480610219f068b4b26cc0c6f10f3d80e  assets/home-net-native-agent-1.7.18-linux-arm64.tar.gz' | sha256sum -c -
          tar -xOzf assets/home-net-native-agent-1.7.18-linux-arm64.tar.gz native-agent-arm64/BUILD-INFO | grep -Fxq 'source_commit=755e602131a3eba76d4e513678fd2b006245c504'
          tar -xOzf assets/home-net-native-agent-1.7.18-linux-arm64.tar.gz native-agent-arm64/BUILD-INFO | grep -Fxq 'version=1.7.18'
      - name: Prepare release assets and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          cp bundle.conf install-all.sh assets/
          cp docs/releases/v1.7.20.md assets/RELEASE_NOTES.md
          git archive --format=tar.gz --prefix=home-net-cudy-v1.7.20/ HEAD > assets/home-net-cudy-v1.7.20.tar.gz
          cat > assets/release-lock.json <<EOF
          {
            "release": "v1.7.20",
            "release_commit": "$GITHUB_SHA",
            "native_source_commit": "755e602131a3eba76d4e513678fd2b006245c504",
            "native_archive_version": "1.7.18",
            "native_archive_sha256": "3c08ef151b0ad7113f157e329bde2607480610219f068b4b26cc0c6f10f3d80e",
            "native_bootstrap_source": "c4e273d419bf4990786ee0dd09cd5744f6838948",
            "native_bootstrap_sha256": "3c0513067718a1e6b580f2f4cc2c0a2d4fae86804472c41cdd7ef70fb1163f47",
            "rollout": "manual",
            "hardware_validated": false
          }
          EOF
          (cd assets && sha256sum bundle.conf install-all.sh RELEASE_NOTES.md release-lock.json home-net-cudy-v1.7.20.tar.gz home-net-native-agent-1.7.18-linux-arm64.tar.gz > SHA256SUMS)
          (cd assets && sha256sum -c SHA256SUMS)
      - name: Publish immutable stable release without deployment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create v1.7.20 assets/bundle.conf assets/install-all.sh assets/RELEASE_NOTES.md assets/release-lock.json assets/SHA256SUMS assets/home-net-cudy-v1.7.20.tar.gz assets/home-net-native-agent-1.7.18-linux-arm64.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'HOME NET 1.7.20 — LuCI prepared transaction recovery' --notes-file assets/RELEASE_NOTES.md
          gh release view v1.7.20 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets --jq '{tagName,isDraft,isPrerelease,assets:[.assets[].name]}'
